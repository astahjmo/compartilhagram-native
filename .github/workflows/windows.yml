name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # A crashing test would otherwise wait forever for a Windows Error
      # Reporting dialog nobody on a headless runner can click — indistinguishable
      # from a genuine hang. Disabling the UI turns that into a normal failure.
      - name: Disable Windows Error Reporting UI
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting" -Name Disabled -Value 1 -Force
      # WebRTC's ICE connectivity checks are UDP and unsigned/first-run test
      # binaries get no chance to be allowed through Windows Defender
      # Firewall on a headless runner (the "Allow this app?" prompt has
      # nobody to answer it) — inbound UDP is silently dropped, so ICE
      # gathers host candidates fine but the connection never reaches
      # "connected" (confirmed: SDP/ICE candidates exchange correctly, but
      # PeerConnectionObserver::OnPeerConnectionState never fires at all).
      # Safe to disable outright: this is a throwaway, isolated CI VM.
      - name: Disable Windows Defender Firewall
        shell: pwsh
        run: Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: f7aed1c7e74fe3a6937c27f72bb68f16a022828a
          path: build-vcpkg
      - name: Install libyuv
        shell: pwsh
        run: |
          & ./build-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build-vcpkg/vcpkg.exe install libyuv:x64-windows-static-md --overlay-triplets=packaging/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-windows -A x64
          -DCMAKE_TOOLCHAIN_FILE="$pwd/build-vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DVCPKG_OVERLAY_TRIPLETS="$pwd/packaging/windows"
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-windows --config Release --parallel 4
      # DIAGNOSTIC: run media_test.exe's nativeEncodeDecode directly, tracing
      # RTC negotiation AND timing the RtcEngine constructor's three init
      # calls (LibWebRTC::Initialize / CreateRTCPeerConnectionFactory /
      # factory_->Initialize). Deliberately NOT using Qt Test's -o file
      # logger here: it buffers each test function's output internally and
      # only writes it out once that function finishes, which made an
      # instant-vs-46s-later distinction invisible in the previous run.
      # Plain stderr, captured live via Tee-Object, preserves real timing.
      - name: Diagnose media test directly
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:COMPARTILHAGRAM_DISABLE_GPU = "1"
          $env:COMPARTILHAGRAM_RTC_DEBUG = "1"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $exe = (Get-ChildItem -Path build-windows -Recurse -Filter media_test.exe | Select-Object -First 1).FullName
          Write-Host "Running: $exe nativeEncodeDecode (only that sub-test, with RTC+timing tracing)"
          & $exe nativeEncodeDecode -v2 2>&1 | ForEach-Object {
            "$(Get-Date -Format 'HH:mm:ss.fff')  $_" | Tee-Object -FilePath media_test_console.txt -Append
          }
          Write-Host "Exit code: $LASTEXITCODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-test-diagnostics
          path: media_test_console.txt
          if-no-files-found: ignore
      - name: Test
        run: ctest --test-dir build-windows -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          cmake --install build-windows --config Release --prefix dist-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-vcpkg/installed/x64-windows-static-md/share/libyuv/copyright dist-windows/share/compartilhagram/libyuv-LICENSE
          Copy-Item build-vcpkg/installed/x64-windows-static-md/share/libjpeg-turbo/copyright dist-windows/share/compartilhagram/libjpeg-turbo-LICENSE
          Copy-Item README.md dist-windows/README.md
          Compress-Archive -Path dist-windows/* -DestinationPath Compartilhagram-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Compartilhagram-windows-x64
          path: Compartilhagram-windows-x64.zip
